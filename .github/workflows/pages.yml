name: Publish to GitHub Pages

# Rebuilds the pages from the content files, then publishes the
# website only. The agent's working files (its brief,
# voice guide, log, content calendar and photo inbox) stay in the
# repository and are left out of the published site.

on:
  push:
    branches: [main]
    # A photo arriving in inbox/ changes nothing on the site by itself.
    # The "Place photos" step starts a publish once it has placed it.
    paths-ignore: ['inbox/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Astro
        run: npm ci --no-audit --no-fund
      - name: Build the pages
        # Astro builds the site into _site. The pages are still made from the data files by
        # .github/scripts/assemble.sh, so they match the Digital Home preview exactly.
        run: npx astro build
      - name: Add the previews of work not yet published
        # Each working copy made in Artiscope Digital Home is a branch named
        # adh/<name>. It is built into preview/<name>/ beside the live site.
        run: |
          git fetch --quiet --depth=1 origin '+refs/heads/adh/*:refs/remotes/origin/adh/*' || true
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/adh/); do
            name="${ref#origin/adh/}"
            case "$name" in *[!a-z0-9-]*|"") continue;; esac
            git worktree add --quiet --detach "/tmp/preview-src/$name" "$ref"
            # A copy made after the move to Astro is built with Astro; an older copy as before.
            if [ -f "/tmp/preview-src/$name/astro.config.mjs" ]; then
              build() {
                (cd "/tmp/preview-src/$name" && npm ci --no-audit --no-fund --silent && npx astro build && mkdir -p /tmp/preview-out && mv _site "/tmp/preview-out/$name") || return 1
                rm -f "/tmp/preview-out/$name/CNAME" "/tmp/preview-out/$name/robots.txt" "/tmp/preview-out/$name/sitemap.xml"
                find "/tmp/preview-out/$name" -name '*.html' -exec sed -i '0,/<head>/s//<head><meta name="robots" content="noindex, nofollow">/' {} +
              }
            else
              build() { bash .github/scripts/assemble.sh "/tmp/preview-src/$name" "/tmp/preview-out/$name" preview; }
            fi
            if build; then
              mkdir -p _site/preview && mv "/tmp/preview-out/$name" "_site/preview/$name"
            else
              echo "The preview of $name could not be built and was left out."
            fi
          done
          echo "Published files:"
          cd _site && find . -type f | sort | head -400
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes cannot find the pages it was just given ("No artifacts
      # named github-pages"). Publishing again a little later works, so it
      # tries up to three times before the run fails.
      - id: deployment
        name: Publish
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: second
        name: Publish, second try
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait a little longer
        if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 60
      - id: third
        name: Publish, third try
        if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
