name: Update previews

# A working copy made in Artiscope Digital Home is a branch named
# adh/<name>. When one changes or is deleted, start a publish so its
# preview is rebuilt. The publish itself always runs from main.

on:
  push:
    branches: ['adh/**']
    paths-ignore: ['inbox/**']
  delete:

permissions:
  actions: write

jobs:
  start:
    if: github.event_name == 'push' || startsWith(github.event.ref, 'adh/')
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
